# ==============================================================================
# SonarCloud Configuration - Web Chepita MTC (Frontend)
# Metodología DevSecOps: SAST + Quality Gate Enforcement
# ==============================================================================

# Parámetros de Organización y Proyecto en SonarCloud
sonar.organization=felipemendozag
sonar.projectKey=FelipeMendozaG_web-chepita-mtc
sonar.projectName=Web Simulacros MTC
sonar.projectVersion=1.0.0

# Codificación y SCM
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Rutas de código fuente y pruebas unitarias
sonar.sources=src
sonar.tests=test,src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.ts

# Reporte de cobertura en formato LCOV generado por Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de análisis estático general
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/out/**,**/coverage/**,**/public/**,**/*.test.js,**/*.config.*

# Exclusiones de métricas de cobertura de código
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/out/**,**/public/**,src/app/**,src/components/**,src/lib/mockData.js

# Bloquear la ejecución del pipeline de CI si no se supera el Quality Gate
sonar.qualitygate.wait=true
